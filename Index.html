<style>

const P={who:['LEIGHTON','CANDACE'],sp:['兩人平分','LEIGHTON','CANDACE']};
function money(){const p={LEIGHTON:0,CANDACE:0},s={LEIGHTON:0,CANDACE:0};let t=0;S.ex.forEach(x=>{t+=x.a;p[x.p]+=x.a;if(x.s=='兩人平分'){s.LEIGHTON+=x.a/2;s.CANDACE+=x.a/2}else s[x.s]+=x.a});const b=p.LEIGHTON-s.LEIGHTON;
return`<h2>記帳</h2><div class="cd"><div class="sm"><div style="background:var(--y)">總支出<b>${W(t)}</b></div><div style="background:var(--a)">LEIGHTON 已付<b>${W(p.LEIGHTON)}</b></div><div style="background:var(--c)">CANDACE 已付<b>${W(p.CANDACE)}</b></div></div><p class="sub" style="margin-top:10px"><b>${Math.abs(b)<1?'目前互不相欠':b>0?'CANDACE 要給 LEIGHTON '+W(b):'LEIGHTON 要給 CANDACE '+W(-b)}</b></p></div><button class="b r" data-a="x" data-i="-1">＋ 新增一筆</button><div class="cd">${S.ex.map((x,i)=>`<div class="ex"><div><b>${E(x.n)}</b><br><span class="tag" style="background:var(--${x.p=='LEIGHTON'?'a':'c'.replace('c','c')})">${x.p} 付</span> <span class="tag">${x.s}</span></div><b>${W(x.a)}</b><button class="ic" data-a="x" data-i="${i}" aria-label="編輯">✎</button></div>`).join('')||'<p class="empty">還沒有記錄，先記下第一筆吧</p>'}</div>`}
function todo(){const n=S.td.filter(x=>x.x).length,l=S.td.length;
return`<h2>出發前待辦</h2><div class="cd"><p>已完成 ${n} / ${l}</p><div class="bar"><i style="width:${l?n/l*100:0}%"></i></div></div><button class="b r" data-a="tn">＋ 新增待辦</button><div class="cd">${S.td.map((x,i)=>`<label class="td"><input type="checkbox" data-a="tc" data-i="${i}"${x.x?' checked':''}><span>${E(x.t)}</span><button class="ic" data-a="tx" data-i="${i}" aria-label="刪除">✕</button></label>`).join('')||'<p class="empty">全部搞定！</p>'}</div>`}
function draw(b){$('#v').innerHTML={home,plan:()=>plan(b),money,todo}[pg]();$('#nv').innerHTML=PG.map(p=>`<button data-a="pg" data-p="${p[0]}" class="${p[0]==pg?'on':''}"${p[0]==pg?' aria-current="page"':''}><svg viewBox="0 0 28 28">${p[2]}</svg>${p[1]}</button>`).join('');tick();if(b)$('.chip.on')?.scrollIntoView({inline:'center',block:'nearest'})}
function tick(){const c=$('#cn');if(!c)return;const ms=new Date('2026-11-27T18:40:00Z')-Date.now();if(ms<=0){$('#cl').textContent=Date.now()>new Date('2026-12-06T10:50:00Z')?'旅程結束，歡迎回家':'旅程進行中';c.innerHTML='';return}const a=[['天',864e5],['時',36e5],['分',6e4],['秒',1e3]];let r=ms;c.innerHTML=a.map(([u,n])=>{const x=Math.floor(r/n);r-=x*n;return`<div><b>${x}</b>${u}</div>`}).join('')}
setInterval(tick,1000);
const IF=[{l:'時間',k:'t',type:'time'},{l:'行程',k:'n'},{l:'交通方式',k:'m',o:MO},{l:'必去',k:'s',c:1},MAPF,{l:'備註',k:'nt'}];
document.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,it=S.days[di].it;
if(a=='pg'){pg=t.dataset.p;draw(1);scrollTo(0,0)}
else if(a=='day'){di=i;draw(1)}
else if(a=='ed'){ed=!ed;draw()}
else if(a=='ei')form('修改行程',IF,it[i],o=>{it[i]=o;it.sort((x,y)=>x.t.localeCompare(y.t))},()=>it.splice(i,1));
else if(a=='add')form('新增行程',IF,{t:'12:00',m:'地鐵'},o=>{it.push(o);it.sort((x,y)=>x.t.localeCompare(y.t))});
else if(a=='rs')form('還原全部資料為預設？',[],{},()=>{S=structuredClone(D)},0,'確定還原');
else if(a=='ef')form('編輯航班',[{l:'航班號',k:'no'},{l:'日期',k:'d'},{l:'出發地',k:'a'},{l:'出發時間',k:'at',type:'time'},{l:'抵達地',k:'b'},{l:'抵達時間',k:'bt',type:'time'}],S.fl[i],o=>S.fl[i]=o);
else if(a=='eh')form('編輯住宿',[{l:'名稱',k:'n'},{l:'入住日期',k:'d'},{l:'地址',k:'ad'},MAPF],S.ht[i],o=>S.ht[i]=o);
else if(a=='x')form(i<0?'新增花費':'編輯花費',[{l:'項目',k:'n'},{l:'金額（韓圓）',k:'a',type:'number'},{l:'誰付',k:'p',o:P.who},{l:'分攤',k:'s',o:P.sp}],i<0?{p:'LEIGHTON',s:'兩人平分'}:S.ex[i],o=>{if(i<0)S.ex.push(o);else S.ex[i]=o},i<0?0:()=>S.ex.splice(i,1));
else if(a=='tn')form('新增待辦',[{l:'內容',k:'t'}],{},o=>o.t&&S.td.push({t:o.t,x:false}));
else if(a=='tc'){S.td[i].x=t.checked;sv();draw()}
else if(a=='tx'){e.preventDefault();S.td.splice(i,1);sv();draw()}
if(a=='pg'||a=='day'||a=='ed')sv()};
draw(1);
</script></body></html>
